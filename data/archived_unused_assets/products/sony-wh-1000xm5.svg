<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="320" height="300" rx="20" fill="url(#spotlight)"/>

  <!-- Decorative Tech Grid Lines -->
  <circle cx="160" cy="150" r="110" fill="none" stroke="#a1a1aa" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="160" cy="150" r="135" fill="none" stroke="#71717a" stroke-opacity="0.1"/>

  <!-- Tech Gadget Vector Art -->
  <g filter="url(#cardShadow)">
    
        <!-- headband -->
        <path d="M85 160 C85 85, 235 85, 235 160" fill="none" stroke="#71717a" stroke-width="12" stroke-linecap="round"/>
        <path d="M100 130 C120 95, 200 95, 220 130" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
        <!-- earcups -->
        <rect x="65" y="145" width="35" height="75" rx="16" fill="#1e293b" stroke="#a1a1aa" stroke-width="3"/>
        <rect x="220" y="145" width="35" height="75" rx="16" fill="#1e293b" stroke="#a1a1aa" stroke-width="3"/>
        <circle cx="82" cy="182" r="10" fill="#a1a1aa" opacity="0.5"/>
        <circle cx="237" cy="182" r="10" fill="#a1a1aa" opacity="0.5"/>
      
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="25" y="246" width="270" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="160" y="264" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sony WH-1000XM5 ANC Headset</text>
  <text x="160" y="278" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Industry Leading Noise Cancel</text>
</svg>