<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="320" height="300" rx="20" fill="url(#spotlight)"/>

  <!-- Decorative Tech Grid Lines -->
  <circle cx="160" cy="150" r="110" fill="none" stroke="#60a5fa" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="160" cy="150" r="135" fill="none" stroke="#3b82f6" stroke-opacity="0.1"/>

  <!-- Tech Gadget Vector Art -->
  <g filter="url(#cardShadow)">
    
        <!-- controller body -->
        <path d="M75 140 C75 100, 110 90, 160 90 C210 90, 245 100, 245 140 C245 185, 225 220, 205 210 C185 200, 175 180, 160 180 C145 180, 135 200, 115 210 C95 220, 75 185, 75 140 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="4"/>
        <!-- d-pad -->
        <path d="M105 130 L115 130 L115 120 L125 120 L125 130 L135 130 L135 140 L125 140 L125 150 L115 150 L115 140 L105 140 Z" fill="#64748b"/>
        <!-- action buttons -->
        <circle cx="195" cy="125" r="5" fill="#38bdf8"/>
        <circle cx="205" cy="135" r="5" fill="#f43f5e"/>
        <circle cx="185" cy="135" r="5" fill="#22c55e"/>
        <circle cx="195" cy="145" r="5" fill="#eab308"/>
        <!-- analog sticks -->
        <circle cx="130" cy="165" r="14" fill="#0f172a" stroke="#60a5fa" stroke-width="3"/>
        <circle cx="190" cy="165" r="14" fill="#0f172a" stroke="#60a5fa" stroke-width="3"/>
      
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="25" y="246" width="270" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="160" y="264" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sony PlayStation 5 Slim 1TB</text>
  <text x="160" y="278" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DualSense Wireless Included</text>
</svg>