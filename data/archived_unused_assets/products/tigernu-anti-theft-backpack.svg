<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="320" height="300" rx="20" fill="url(#spotlight)"/>

  <!-- Decorative Tech Grid Lines -->
  <circle cx="160" cy="150" r="110" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="160" cy="150" r="135" fill="none" stroke="#52525b" stroke-opacity="0.1"/>

  <!-- Tech Gadget Vector Art -->
  <g filter="url(#cardShadow)">
    
        <!-- backpack body -->
        <path d="M100 80 Q160 50, 220 80 L235 220 Q160 240, 85 220 Z" fill="#1e293b" stroke="#52525b" stroke-width="4"/>
        <!-- top handle -->
        <path d="M135 65 Q160 45, 185 65" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
        <!-- front pocket -->
        <path d="M105 135 L215 135 L210 205 Q160 220, 110 205 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <!-- zipper accent -->
        <line x1="120" y1="135" x2="200" y2="135" stroke="#38bdf8" stroke-width="3"/>
        <text x="160" y="175" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">WATERPROOF TECH</text>
      
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="25" y="246" width="270" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="160" y="264" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Tigernu Anti-Theft Backpack</text>
  <text x="160" y="278" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Waterproof 15.6" Laptop Case</text>
</svg>