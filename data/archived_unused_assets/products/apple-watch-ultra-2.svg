<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="320" height="300" rx="20" fill="url(#spotlight)"/>

  <!-- Decorative Tech Grid Lines -->
  <circle cx="160" cy="150" r="110" fill="none" stroke="#fb923c" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="160" cy="150" r="135" fill="none" stroke="#f97316" stroke-opacity="0.1"/>

  <!-- Tech Gadget Vector Art -->
  <g filter="url(#cardShadow)">
    
        <!-- watch strap -->
        <path d="M125 40 L195 40 L190 90 L130 90 Z" fill="#334155"/>
        <path d="M130 210 L190 210 L195 260 L125 260 Z" fill="#334155"/>
        <!-- watch case -->
        <rect x="110" y="80" width="100" height="135" rx="30" fill="#0f172a" stroke="#f97316" stroke-width="5"/>
        <rect x="120" y="90" width="80" height="115" rx="22" fill="#18181b"/>
        <!-- digital dial ring -->
        <circle cx="160" cy="147" r="32" fill="none" stroke="#fb923c" stroke-width="4" stroke-dasharray="140 40"/>
        <text x="160" y="152" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">10:45</text>
        <!-- digital crown -->
        <rect x="212" y="115" width="6" height="24" rx="3" fill="#fb923c"/>
      
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="25" y="246" width="270" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="160" y="264" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Apple Watch Ultra 2 Titanium</text>
  <text x="160" y="278" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">49mm GPS + Cellular LTE</text>
</svg>