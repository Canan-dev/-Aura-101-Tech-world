<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="320" height="300" rx="20" fill="url(#spotlight)"/>

  <!-- Decorative Tech Grid Lines -->
  <circle cx="160" cy="150" r="110" fill="none" stroke="#60a5fa" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="160" cy="150" r="135" fill="none" stroke="#2563eb" stroke-opacity="0.1"/>

  <!-- Tech Gadget Vector Art -->
  <g filter="url(#cardShadow)">
    
        <!-- screen frame -->
        <rect x="50" y="70" width="220" height="140" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="4"/>
        <rect x="58" y="78" width="204" height="124" rx="4" fill="#1e1e24"/>
        <!-- screen art / vibrant 4k colors -->
        <path d="M58 170 Q120 110, 180 140 T262 130 L262 202 L58 202 Z" fill="#60a5fa" opacity="0.6"/>
        <circle cx="190" cy="115" r="24" fill="#f59e0b" opacity="0.7"/>
        <text x="75" y="102" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" opacity="0.8">4K ULTRA HD</text>
        <!-- stand legs -->
        <path d="M85 210 L75 230" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
        <path d="M235 210 L245 230" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
      
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="25" y="246" width="270" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="160" y="264" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Samsung 65" QLED 4K Smart TV</text>
  <text x="160" y="278" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Quantum HDR & Tizen OS</text>
</svg>