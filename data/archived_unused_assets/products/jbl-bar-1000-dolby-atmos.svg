<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="320" height="300" rx="20" fill="url(#spotlight)"/>

  <!-- Decorative Tech Grid Lines -->
  <circle cx="160" cy="150" r="110" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="160" cy="150" r="135" fill="none" stroke="#0284c7" stroke-opacity="0.1"/>

  <!-- Tech Gadget Vector Art -->
  <g filter="url(#cardShadow)">
    
        <!-- long bar -->
        <rect x="40" y="130" width="240" height="40" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="3"/>
        <line x1="50" y1="150" x2="270" y2="150" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
        <!-- subwoofer -->
        <rect x="80" y="80" width="60" height="90" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
        <circle cx="110" cy="120" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <!-- dolby badge -->
        <rect x="220" y="138" width="50" height="22" rx="4" fill="#000000"/>
        <text x="245" y="153" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ATMOS</text>
      
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="25" y="246" width="270" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="160" y="264" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">JBL Bar 1000 7.1.4 Dolby Atmos</text>
  <text x="160" y="278" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Wireless Detachable Surrounds</text>
</svg>