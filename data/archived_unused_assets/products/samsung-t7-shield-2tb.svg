<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="320" height="300" rx="20" fill="url(#spotlight)"/>

  <!-- Decorative Tech Grid Lines -->
  <circle cx="160" cy="150" r="110" fill="none" stroke="#34d399" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="160" cy="150" r="135" fill="none" stroke="#059669" stroke-opacity="0.1"/>

  <!-- Tech Gadget Vector Art -->
  <g filter="url(#cardShadow)">
    
        <!-- rugged ssd drive -->
        <rect x="85" y="80" width="150" height="160" rx="18" fill="#1e293b" stroke="#059669" stroke-width="5"/>
        <rect x="95" y="90" width="130" height="140" rx="12" fill="#0f172a"/>
        <!-- rubber bumper ridges -->
        <line x1="90" y1="110" x2="90" y2="210" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
        <line x1="230" y1="110" x2="230" y2="210" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
        <text x="160" y="145" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">2TB</text>
        <text x="160" y="170" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NVMe SSD 1050MB/s</text>
        <circle cx="160" cy="205" r="4" fill="#22c55e"/>
      
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="25" y="246" width="270" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="160" y="264" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Samsung T7 Shield 2TB SSD</text>
  <text x="160" y="278" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Rugged IP65 Drop-Proof 1050MB/s</text>
</svg>