<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="320" height="300" rx="20" fill="url(#spotlight)"/>

  <!-- Decorative Tech Grid Lines -->
  <circle cx="160" cy="150" r="110" fill="none" stroke="#7dd3fc" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="160" cy="150" r="135" fill="none" stroke="#38bdf8" stroke-opacity="0.1"/>

  <!-- Tech Gadget Vector Art -->
  <g filter="url(#cardShadow)">
    
        <!-- sleek streaming box -->
        <rect x="65" y="120" width="130" height="60" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
        <circle cx="85" cy="150" r="4" fill="#22c55e"/>
        <text x="135" y="155" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">TV 4K PRO</text>
        <!-- remote control -->
        <rect x="215" y="70" width="45" height="150" rx="16" fill="#1f2937" stroke="#7dd3fc" stroke-width="2"/>
        <circle cx="237" cy="110" r="14" fill="#374151" stroke="#9ca3af" stroke-width="2"/>
        <circle cx="237" cy="110" r="5" fill="#7dd3fc"/>
        <rect x="225" y="140" width="24" height="6" rx="2" fill="#ef4444"/>
        <rect x="225" y="155" width="24" height="6" rx="2" fill="#3b82f6"/>
        <rect x="225" y="170" width="24" height="6" rx="2" fill="#10b981"/>
      
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="25" y="246" width="270" height="38" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="160" y="264" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Apple TV 4K 128GB Wi-Fi+Ethernet</text>
  <text x="160" y="278" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">A15 Bionic & Siri Remote</text>
</svg>